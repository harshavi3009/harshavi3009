# Draws a snake eating your contribution graph, in pink.
# It runs once a day, whenever you change the README, and whenever you press "Run workflow".
name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight (UTC)
  workflow_dispatch:       # adds the "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write          # lets it save the snake images to your repo

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff4f9a&color_dots=#ebedf0,#ffd6e8,#ff9ac7,#ff6fae,#e0337f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4f9a&color_dots=#161b22,#5c1f3d,#99305f,#d94585,#ff6fae

      - name: Save the images to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
